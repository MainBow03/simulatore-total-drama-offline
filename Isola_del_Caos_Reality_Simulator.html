.brand{font-size:clamp(20px,3vw,32px);font-weight:1000;letter-spacing:-1.5px}.brand span{color:var(--gold)}.tag{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:900}

function startScreen(){

function createSeason(){

 if($('#castMode').value==='manual'&&cast.length<4){toast('Seleziona almeno 4 concorrenti!');return}
 if(cast.length>n)cast=shuffle(cast).slice(0,n);if(cast.length<n&&$('#castMode').value==='manual')n=cast.length;
 let names=shuffle(cast),teams=Array.from({length:Math.min(tc,cast.length)},(_,i)=>({id:i,name:TEAM_NAMES[i],color:TEAM_COLORS[i],members:[]}));
 names.forEach((p,i)=>teams[i%teams.length].members.push({...p,alive:true,team:teams[i%teams.length].id, votesReceived:0, immunityWins:0, individualWins:0, teamWins:0, placement:null, voteHistory:[]}));

function renderEpisodeIntro(){

 });

 eliminated.alive=false;eliminated.placement=active().length+1;

 game.lastEpisode={number:game.episode,challenge,winner,loser,immunity,votes,voteCounts,eliminated,events,dialogues,recap,aliveAtStart:alive.length,teamScores:scores};
 game.history.push({episode:game.episode,eliminated,votes:[{count:max}],winner:winner.name,loser:loser.name,challenge:challenge.title});
 currentPhase=0;renderPhase();
}
function relationshipSkill(p){return Math.random()*2}
function rel(a,b){return game.relationships[a.name+'|'+b.name]??.5}
function setRel(a,b,v){game.relationships[a.name+'|'+b.name]=Math.max(0,Math.min(1,v))}
function chooseVote(voter,options,team){
 let scored=options.map(p=>{let hostility=1-rel(voter,p),threat=(p.immunityWins+p.individualWins)*.04,random=Math.random()*.65;return {p,s:hostility*.48+threat+random}});
 scored.sort((a,b)=>b.s-a.s);return scored[0].p
}
function voteReason(a,b){return pick([`${b.name} è una minaccia troppo grande.`,`${b.name} non ha fatto gioco di squadra.`,`Non mi fido di ${b.name}, e non voglio aspettare che sia troppo tardi.`,`Qualcuno deve pagare per il disastro di oggi, e ${b.name} è il bersaglio più semplice.`,`Strategicamente è la mossa che mi conviene.`,`Dopo quello che è successo al campo, non posso più coprire ${b.name}.`])}
function generateEvents(alive,teams,winner,loser,ch,immunity){
 let ev=[],pairPool=shuffle(alive);
 let a=pairPool[0],b=pairPool[1],c=pairPool[2],d=pairPool[3];
 if(a&&b){let type=pick(['amicizia','rivalità','gossip','assurdità']);if(type==='amicizia'){setRel(a,b,rel(a,b)-.25);setRel(b,a,rel(b,a)-.2);ev.push({icon:'💛',tag:'NUOVO LEGAME',text:`${a.name} e ${b.name} hanno passato la mattina a parlare lontano dagli altri. Potrebbe essere nata un'amicizia… oppure una coppia di complici pericolosi.`})}
 else if(type==='rivalità'){setRel(a,b,rel(a,b)+.4);setRel(b,a,rel(b,a)+.3);ev.push({icon:'⚡',tag:'SCINTILLE',text:`${a.name} ha accusato ${b.name} di sabotare il gruppo. ${b.name} ha risposto con un applauso sarcastico. La pace è durata circa quattro secondi.`})}
 else if(type==='gossip'){ev.push({icon:'👀',tag:'GOSSIP DI CAMPO',text:`${a.name} ha confidato a ${b.name} che qualcuno sta organizzando un'alleanza segreta. Il problema? Non sa se la voce sia vera. ${b.name} la sta già raccontando a qualcun altro.`})}
 else {ev.push({icon:'🦆',tag:'MOMENTO ASSURDO',text:`${a.name} ha dichiarato guerra a una papera perché “mi fissava in modo strategico”. ${b.name} ha accettato di fare da avvocato alla papera.`})}}
 if(c&&d){ev.push({icon:'🗯️',tag:'SCENA RUBATA',text:pick([`${c.name} ha provato a fare un discorso motivazionale. ${d.name} si è addormentato a metà frase, russando sul finale.`,`${c.name} ha promesso di cucinare per tutti. Il risultato è stato descritto da ${d.name} come “un crimine contro la verdura”.`,`${c.name} e ${d.name} hanno stretto una tregua segreta che è durata finché non è finito il succo.`,`${c.name} ha chiesto a ${d.name} di coprirgli le spalle. ${d.name} ha capito letteralmente e si è messo dietro di lui.`])})}
 ev.push({icon:'🎯',tag:'LA SFIDA',text:`La prova di oggi è “${ch.title}”: ${ch.desc}`});
 ev.push({icon:'🏆',tag:'IMMUNITÀ DI SQUADRA',text:`${winner.name} conquista la vittoria! ${immunity.name} si distingue nella prova e riceve anche un riconoscimento individuale per la prestazione.`});
 ev.push({icon:'🌧️',tag:'DOPO LA SCONFITTA',text:`Nel team ${loser.name} nessuno vuole prendersi la colpa. ${pick(loser.members).name} propone di “parlare con calma”, ma tre persone iniziano a parlare contemporaneamente.`});
 return ev
}
function generateDialogues(alive,teams){let pool=shuffle(alive).slice(0,6),templates=[
(a,b)=>`${a.name}: «Io non sto dicendo che non mi fido di te. Sto dicendo che se mi dai una mappa, controllo anche il retro.»`,
(a,b)=>`${a.name}: «Hai un piano?» ${b.name}: «Sì.» ${a.name}: «Qual è?» ${b.name}: «Speravo lo sapessi tu.»`,
(a,b)=>`${a.name}: «Siamo una squadra!» ${b.name}: «Certo. Una squadra che perde, ma una squadra.»`,
(a,b)=>`${a.name}: «Ho sentito una cosa…» ${b.name}: «È vera?» ${a.name}: «Non lo so, ma l'ho già raccontata a quattro persone.»`,
(a,b)=>`${a.name}: «Non farei mai una cosa del genere.» ${b.name}: «L'hai fatta ieri.» ${a.name}: «Ieri ero una persona diversa.»`,
(a,b)=>`${a.name}: «La strategia è semplice: improvvisare con sicurezza.» ${b.name}: «È la frase più spaventosa che abbia mai sentito.»`
];return pool.slice(0,5).map((a,i)=>templates[i%templates.length](a,pool[(i+1)%pool.length]||a))}
function phaseNav(){return `<div class="phasebar">${phases.map((p,i)=>`<div class="phase ${i<currentPhase?'done':i===currentPhase?'active':''}">${i<currentPhase?'✓ ':''}${i+1}. ${p}</div>`).join('')}</div>`}
function teamMarkup(){return `<div class="teamgrid">${livingTeams().map(t=>`<div class="team" style="--team:${t.color}"><h3>${esc(t.name)} <span class="pill">${t.members.length} rimasti</span></h3><div class="team-members">${t.members.map(p=>`<div class="member">${portrait(p)}<div>${esc(p.name)}</div></div>`).join('')}</div></div>`).join('')}</div>`}
function eventMarkup(e){return `<div class="event"><div class="icon">${e.icon}</div><div><small>${esc(e.tag)}</small><p>${esc(e.text)}</p></div></div>`}
function phaseContent(){
 let e=game.lastEpisode;
 if(currentPhase===0)return `<div class="scene"><div class="eyebrow">PRECEDENTEMENTE SULL'ISOLA…</div><h3>Il recap che nessuno ha chiesto, ma tutti meritano</h3><p>${esc(e.recap)}</p></div><div class="feed" style="margin-top:14px">${e.events.slice(0,2).map(eventMarkup).join('')}</div>`;
 if(currentPhase===1)return `<div class="scene"><div class="eyebrow">IL CAST È PRONTO</div><h3>La situazione al campo base</h3><p>Restano <b>${active().length}</b> concorrenti. Le squadre sono ancora in gioco, ma la fiducia è una risorsa sempre più rara.</p></div><div style="margin-top:15px">${teamMarkup()}</div>`;
 if(currentPhase===2)return `<div class="scene"><div class="eyebrow">DRAMMI • ALLEANZE • FIGURACCE</div><h3>Le telecamere non dormono mai</h3><p>Queste sono le scene che hanno cambiato gli equilibri, o almeno rovinato la colazione.</p></div><div class="feed" style="margin-top:14px">${e.events.filter(x=>!['LA SFIDA','IMMUNITÀ DI SQUADRA','DOPO LA SCONFITTA'].includes(x.tag)).map(eventMarkup).join('')}${e.dialogues.map(d=>`<div class="dialogue">${esc(d)}</div>`).join('')}</div>`;
 if(currentPhase===3)return `<div class="challenge"><div class="eyebrow">PROVA UFFICIALE • EPISODIO ${e.number}</div><h3 style="font-size:32px;margin:8px 0">${esc(e.challenge.title)}</h3><p class="muted">${esc(e.challenge.desc)}</p><div class="stats"><div class="stat"><b>${e.aliveAtStart}</b><span>CONCORRENTI IN PARTENZA</span></div><div class="stat"><b>${livingTeams().length}</b><span>TEAM IN GARA</span></div><div class="stat"><b>1</b><span>OBIETTIVO: IMMUNITÀ</span></div></div><p style="margin-top:18px">Durante la prova, ${e.immunity.name} ha sorpreso tutti. Qualcuno sostiene che sia stato talento, altri parlano già di fortuna sfacciata.</p></div>`;
 if(currentPhase===4)return `<div class="scene"><div class="eyebrow">RISULTATO UFFICIALE</div><h3>La vittoria ha un colore.</h3><p>La squadra vincitrice può festeggiare. Quella sconfitta deve scegliere chi pagherà il prezzo.</p></div><div class="teamgrid" style="margin-top:14px"><div class="team" style="--team:${e.winner.color}"><h3>🏆 ${esc(e.winner.name)} — VINCE!</h3><p>La squadra festeggia, anche se qualcuno si attribuisce già tutto il merito.</p><div class="castrow">${e.winner.members.map(p=>`<div class="mini">${portrait(p)}<strong>${esc(p.name)}</strong></div>`).join('')}</div></div><div class="team" style="--team:${e.loser.color}"><h3>💀 ${esc(e.loser.name)} — A RISCHIO</h3><p>Questa sera qualcuno lascerà l'isola. Le alleanze diventano improvvisamente molto interessate.</p><div class="castrow">${e.loser.members.filter(p=>p.alive||p===e.eliminated).map(p=>`<div class="mini">${portrait(p)}<strong>${esc(p.name)}</strong></div>`).join('')}</div></div></div><div class="reveal"><span class="pill">🛡️ IMMUNITÀ INDIVIDUALE</span><h3>${esc(e.immunity.name)}</h3><p>La sua prestazione gli garantisce un episodio tranquillo… e agli altri un nuovo motivo per preoccuparsi.</p></div>`;
 if(currentPhase===5)return `<div class="scene"><div class="eyebrow">CERIMONIA DI ELIMINAZIONE</div><h3>Le luci si abbassano. I sorrisi spariscono.</h3><p>Ogni concorrente del team perdente ha scritto un nome. Le schede verranno lette una alla volta. Chi non sente il proprio nome può tirare un sospiro di sollievo… per ora.</p><div class="castrow">${e.loser.members.map(p=>`<div class="mini">${portrait(p)}<strong>${esc(p.name)}</strong></div>`).join('')}</div><p class="torch">🔥 🔥 🔥 🔥 🔥</p><button class="pink" onclick="nextPhase()">Rivela i voti, uno alla volta →</button></div>`;
 if(currentPhase===6)return `<div class="scene"><div class="eyebrow">LE SCHEDE SONO STATE APERTE</div><h3>Chi ha votato chi?</h3><p>Ogni voto ha una motivazione. Le scelte possono sorprendere, le alleanze possono incrinarsi e nessuno può fingere di non aver sentito.</p></div><div style="margin-top:14px">${e.votes.map((v,i)=>`<div class="vote-card"><div class="torch" style="font-size:24px">🗳️</div><div><b>${esc(v.from.name)}</b> ha votato <b style="color:var(--pink)">${esc(v.to.name)}</b><div class="muted tiny">${esc(v.reason)}</div></div><span class="pill">VOTO ${i+1}</span></div>`).join('')}<h3 style="margin-top:25px">Conteggio finale</h3>${Object.entries(e.voteCounts).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="scoreline"><b style="width:130px">${esc(n)}</b><div class="bar"><i style="width:${c/Math.max(...Object.values(e.voteCounts),1)*100}%;background:var(--pink)"></i></div><b>${c}</b></div>`).join('')}</div>`;
 if(currentPhase===7)return `<div class="reveal"><div class="eyebrow">IL VIAGGIO FINISCE QUI</div><div class="eliminated">${portrait(e.eliminated)}<div><span class="pill">ELIMINATO • EPISODIO ${e.number}</span><h2 style="font-size:34px;margin:8px 0">${esc(e.eliminated.name)}</h2><p class="muted">La torcia si spegne. Ma prima, un'ultima parola.</p></div></div><p class="monologue">«${esc(monologue(e.eliminated,e))}»</p><p class="muted">L'eliminazione è definitiva. Le relazioni e i voti di questa puntata resteranno nel recap di stagione.</p></div><div class="row" style="margin-top:16px"><button onclick="advanceEpisode()">🎬 ${active().length<=2?'Vai al finale':'Prossimo episodio'} →</button><button class="secondary" onclick="showStats()">📊 Statistiche provvisorie</button></div>`;
}
function monologue(p,e){let opts=[`Pensavo di poter arrivare più lontano. Ho fatto errori, mi sono fidato delle persone sbagliate e forse ho sottovalutato il gioco. ${pick(['Non è finita qui: questa è solo una pausa pubblicitaria.','Almeno non dovrò più mangiare quella roba della mensa.','Spero che vi ricordiate di me… soprattutto tu, ${pick(active()).name}.'])}`,`Non mi aspettavo questo risultato. Se devo essere sincero, alcune persone qui mi hanno deluso. Ma non darò loro la soddisfazione di vedermi implorare.`, `È stato assurdo, divertente e completamente ingiusto. Avrei voluto giocare un altro episodio, ma evidentemente qualcuno aveva già scritto il finale.`, `Non rimpiango le mie mosse. Forse una o due. O tutte quelle fatte dopo pranzo. Ma almeno ho lasciato il segno.`];return pick(opts).replace('${pick(active()).name}',pick(active())?.name||'nessuno')}
function renderPhase(){
 if(!game)return;let e=game.lastEpisode;
 $('#app').innerHTML=`<div class="episode-head"><div><div class="eyebrow">STAGIONE • ${esc(game.name.toUpperCase())}</div><h2>EPISODIO ${e.number} <span style="color:var(--gold)">/ IL CAOS CONTINUA</span></h2></div><div class="row" style="flex:0 1 auto"><span class="pill">👥 ${active().length} ancora in gara</span><span class="pill">🔥 ${game.history.length} episodi</span></div></div>${phaseNav()}<div class="grid"><section class="card span8"><div class="row" style="margin-bottom:14px"><h2 class="section-title" style="margin:0">${phases[currentPhase]}</h2><span class="pill">FASE ${currentPhase+1} DI ${phases.length}</span></div>${phaseContent()}</section><aside class="card span4"><h2 class="section-title">📡 Diretta dall'isola</h2><p class="muted tiny">Le ultime notizie che la produzione ha deciso di non censurare.</p><div class="feed">${e.events.slice(0,4).map(eventMarkup).join('')}</div><hr style="border:0;border-top:1px solid #ffffff16;margin:18px 0"><h3 class="section-title">🧭 Stato della gara</h3><div class="stats"><div class="stat"><b>${active().length}</b><span>IN GARA</span></div><div class="stat"><b>${game.history.length}</b><span>ELIMINATI</span></div><div class="stat"><b>${game.teams.length}</b><span>TEAM INIZIALI</span></div></div><button class="secondary" style="width:100%;margin-top:14px" onclick="showStats()">Apri statistiche</button></aside></div><div class="row" style="justify-content:space-between;margin-top:18px"><button class="secondary" onclick="prevPhase()" ${currentPhase===0?'disabled':''}>← Fase precedente</button>${currentPhase<7?`<button onclick="nextPhase()">${currentPhase===4?'Preparati alla cerimonia':currentPhase===5?'Leggi le schede':currentPhase===6?'Ascolta il monologo':'Continua'} →</button>`:`<span class="pill">Episodio archiviato</span>`}</div>`;
}
function nextPhase(){if(currentPhase<7){currentPhase++;renderPhase()}else toast('Vai al prossimo episodio!')}
function prevPhase(){if(currentPhase>0){currentPhase--;renderPhase()}}
function advanceEpisode(){if(active().length<=2){game.finished=true;game.finale=active();renderFinale()}else renderEpisodeIntro()}
function showStats(){let p=[...game.players].sort((a,b)=>b.votesReceived-a.votesReceived);let html=`<div class="scene"><div class="eyebrow">CONTROL ROOM</div><h3>Statistiche della stagione</h3><p>Qui trovi il tabellone aggiornato: voti ricevuti, immunità e stato in gara.</p></div><div class="card" style="margin-top:14px;overflow:auto"><table class="table"><thead><tr><th>CONCORRENTE</th><th>STATO</th><th>VOTI RICEVUTI</th><th>IMMUNITÀ</th></tr></thead><tbody>${p.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.alive?'🟢 In gara':'🔴 Eliminato'}</td><td>${x.votesReceived}</td><td>${x.immunityWins}</td></tr>`).join('')}</tbody></table><button style="margin-top:15px" onclick="renderPhase()">Torna all'episodio</button></div>`;$('#app').innerHTML=html}
function renderFinale(){
 let players=[...game.players];players.filter(p=>p.alive).forEach(p=>p.placement=1);let eliminated=players.filter(p=>!p.alive).sort((a,b)=>(b.placement||0)-(a.placement||0));let finalists=players.filter(p=>p.alive);
 // Keep finale suspense, then assign places based on the final challenge.
 if(finalists.length>1){let ordered=shuffle(finalists);ordered.forEach((p,i)=>p.placement=i+1);game.finale=ordered}
 let ranking=players.sort((a,b)=>(a.placement||999)-(b.placement||999));
 $('#app').innerHTML=`<section class="hero"><div class="eyebrow">GRAN FINALE • STAGIONE COMPLETATA</div><h1>Una sola corona.<br><span style="color:var(--gold)">Troppe storie.</span></h1><p>La stagione ${esc(game.name)} è arrivata al capolinea. Tra alleanze, tradimenti e prove discutibili, ecco chi ha conquistato il primo posto e chi invece torna a casa con un trauma da reality.</p><div class="row"><span class="pill">🎬 ${game.history.length} episodi</span><span class="pill">🎭 ${game.players.length} concorrenti</span><span class="pill">🗳️ ${game.players.reduce((s,p)=>s+p.votesReceived,0)} voti ricevuti</span></div></section>
 <div class="grid"><section class="card span8"><h2 class="section-title">🏆 Classifica finale</h2><div class="feed">${ranking.map((p,i)=>`<div class="vote-card"><div class="rank">${i+1}</div>${portrait(p)}<div><b>${esc(p.name)}</b><div class="muted tiny">${i===0?'VINCITORE DELLA STAGIONE':p.alive?'Finalista':'Eliminato all’episodio '+(p.placement||'?')}</div></div><span class="pill">${p.votesReceived} voti</span></div>`).join('')}</div></section><section class="card span4"><h2 class="section-title">📊 Numeri del caos</h2><div class="stats"><div class="stat"><b>${game.history.length}</b><span>EPISODI</span></div><div class="stat"><b>${game.players.length}</b><span>CONCORRENTI</span></div><div class="stat"><b>${game.players.reduce((s,p)=>s+p.votesReceived,0)}</b><span>VOTI TOTALI</span></div></div><h3 style="margin-top:22px">🗳️ Più votati</h3>${[...game.players].sort((a,b)=>b.votesReceived-a.votesReceived).slice(0,5).map((p,i)=>`<div class="scoreline"><b style="width:110px">${esc(p.name)}</b><div class="bar"><i style="width:${p.votesReceived/Math.max(1,...game.players.map(x=>x.votesReceived))*100}%;background:var(--pink)"></i></div><b>${p.votesReceived}</b></div>`).join('')}<h3 style="margin-top:22px">🛡️ Re delle immunità</h3>${[...game.players].sort((a,b)=>b.immunityWins-a.immunityWins).slice(0,5).map(p=>`<div class="scoreline"><b style="width:110px">${esc(p.name)}</b><div class="bar"><i style="width:${p.immunityWins/Math.max(1,...game.players.map(x=>x.immunityWins))*100}%;background:var(--green)"></i></div><b>${p.immunityWins}</b></div>`).join('')}</section><section class="card span12"><h2 class="section-title">📺 Recap della stagione</h2><div class="feed">${game.history.map(h=>`<div class="event"><div class="icon">📼</div><div><small>EPISODIO ${h.episode} • ${esc(h.challenge)}</small><p><b>${esc(h.winner)}</b> ha vinto la sfida; <b>${esc(h.loser)}</b> ha perso. Eliminato: <b style="color:var(--pink)">${esc(h.eliminated.name)}</b>.</p></div></div>`).join('')}</div><div class="row" style="margin-top:20px"><button onclick="startScreen()">🔁 Crea una nuova stagione</button><button class="secondary" onclick="saveGame()">💾 Salva questa stagione</button></div></section></div>`;
}
function saveGame(){if(!game){toast('Non c’è una partita da salvare.');return}try{localStorage.setItem('isolaCaosSave',JSON.stringify({game,currentPhase}));toast('Partita salvata in questo browser!')}catch(e){toast('Impossibile salvare: memoria non disponibile.')}}
function loadGame(){try{let x=JSON.parse(localStorage.getItem('isolaCaosSave'));if(!x){toast('Non trovo salvataggi in questo browser.');return}game=x.game;currentPhase=x.currentPhase||0;if(game.finished)renderFinale();else if(game.lastEpisode)renderPhase();else renderEpisodeIntro();toast('Partita caricata!')}catch(e){toast('Salvataggio non valido.')}}
$('#saveBtn').onclick=saveGame;$('#loadBtn').onclick=loadGame;
startScreen();
</script></body></html>
